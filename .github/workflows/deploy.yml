name: Static Website Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Static Website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify website and Jekyll configuration files
        shell: bash
        run: |
          set -euo pipefail

          for file in index.html _config.yml; do
            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::Missing or empty required file"
              exit 1
            fi
          done

          echo "Website and Jekyll configuration files verified."

      - name: Validate Jekyll configuration
        shell: ruby
        run: |
          require "yaml"

          config = YAML.safe_load_file("_config.yml", aliases: true)
          abort "Jekyll configuration must be a mapping" unless config.is_a?(Hash)

          puts "Valid Jekyll configuration YAML."

      - name: Install HTML validator
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            html5validator==0.4.2

      - name: Validate HTML documents
        run: |
          html5validator \
            --root . \
            --match "*.html" \
            --show-warnings

      - name: Record validation scope
        shell: bash
        run: |
          echo "Static website validation completed."
          echo "No deployment performed."
          echo "No Docker containers or database services started."
          echo "No package-manager workspace execution performed."
          echo "Validation covered required files, Jekyll YAML, and HTML."
