name: GAIOS Database Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-database:
    name: Validate PostgreSQL schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gaios_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gaios_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply schema migration
        env:
          PGPASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          psql \
            --host localhost \
            --username postgres \
            --dbname gaios_test \
            --set ON_ERROR_STOP=1 \
            --file gaios/database/migrations/001_initial_schema.sql

      - name: Run schema assertions
        env:
          PGPASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          psql \
            --host localhost \
            --username postgres \
            --dbname gaios_test \
            --set ON_ERROR_STOP=1 \
            --file gaios/database/tests/001_schema_assertions.sql

