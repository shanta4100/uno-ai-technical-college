# Jekyll Configuration for GitHub Pages
theme: jekyll-theme-minimal
title: UNO AI Technical College
description: Practical AI and tech training
show_downloads: false

# Custom domain (update with your actual domain)
# url: https://unoaitechcollege.com

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from build
exclude:
  - .github
  - .gitignore
  - README.md
  - CNAME
